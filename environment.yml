name: devofou
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.10
  - pip
  
  # PyTorch 1.12 + CUDA 11.6 (sweet spot pour V100 + headers modernes)
  - pytorch=1.12.1
  - torchvision=0.13.1
  - torchaudio=0.12.1
  - cudatoolkit=11.6
  
  # CUDA dev tools (nvcc) — nécessaire pour compiler les extensions
  - cuda-nvcc=11.6
  - cuda-cudart-dev=11.6
  - cuda-libraries-dev=11.6
  
  # Sysroot compatible avec CUDA 11.x (évite le bug __int128)
  - sysroot_linux-64=2.17
  - gcc_linux-64=10
  - gxx_linux-64=10
  
  # libxcrypt pour avoir crypt.h proprement
  - libxcrypt
  
  # PyG extension
  - pytorch-scatter
  
  # Scientific stack
  - numpy
  - scipy
  - matplotlib
  - tqdm
  - pyyaml
  - tensorboard
  
  - pip:
    - plyfile
    - opencv-python
    - h5py
    - hdf5plugin
    - evo
    - gdown
    - natsort
    - pandas
    - seaborn
    - rerun-sdk==0.14.1
    - rosbags
    - numba
    - tabulate
    - yacs
    - configargparse
    - ruamel.yaml
    - lz4
    - zstandard
